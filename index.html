<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notepad v9</title>
<link rel="icon" type="image/png" href="iconmonstr-note-23-240.png">

<script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
      "firebase/database": "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"
    }
  }
</script>

<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <h1>Notepad</h1>
  <span class="version">v9</span>
  <div id="status" role="status" aria-live="polite"><div id="dot"></div><span id="stTxt">Connexion...</span></div>
  <button id="btnExport" class="btn" onclick="exportNotes()" disabled>Exporter les notes</button>
  <div id="userInfo" style="display:none">
    <span id="userEmail"></span>
    <button id="btnSignOut" onclick="handleSignOut()">Déconnexion</button>
  </div>
</header>

<div class="app">
  <aside>
    <div class="sb-tabs">
      <button type="button" id="tabNotes" class="sb-tab active" aria-pressed="true" onclick="switchTab('notes')">Notes <span class="tab-count" id="countNotes">0</span></button>
      <button type="button" id="tabArch" class="sb-tab arch-tab" aria-pressed="false" onclick="switchTab('archived')">Archives <span class="tab-count" id="countArch">0</span></button>
      <button type="button" id="tabTrash" class="sb-tab" aria-pressed="false" onclick="switchTab('trash')">Corbeille <span class="tab-count" id="countTrash">0</span></button>
    </div>
    <div class="sb-top">
      <input type="text" id="search" aria-label="Rechercher dans les notes" placeholder="Recherche rapide..." oninput="renderList()">
      <button id="btnNew" aria-label="Nouvelle note" title="Nouvelle note" onclick="createNewNote()">+</button>
    </div>
    <div id="tagFilter"></div>
    <div id="notesViewport">
    <div id="pinnedWrap" class="hide">
      <div class="section-title">Épinglées</div>
      <div id="pinnedList"></div>
    </div>
    <div id="list"></div>
    </div>
  </aside>

  <div id="editorResize" role="separator" tabindex="0" aria-label="Largeur de l’éditeur" aria-orientation="vertical" aria-controls="editor" aria-valuemin="25" aria-valuemax="65" aria-valuenow="33"></div>
  <main id="editor" class="hide">
    <div class="toolbar">
      <input type="text" id="title" aria-label="Titre de la note" placeholder="Titre de la note">
      <div class="toolbar-buttons">
        <button class="btn" id="btnSave" title="Enregistrer (Ctrl+S ou ⌘S)" onclick="saveCurrentNote()">Enregistrer</button>
        <button class="btn" id="btnDupl" onclick="duplicateNote()">Dupliquer</button>
        <button class="btn" id="btnPin" onclick="togglePin()">Épingler</button>
        <button class="btn" id="btnArch" onclick="toggleArchive()">Action</button>
        <button class="btn" id="btnHistory" onclick="showHistory()">Historique</button>
        <button class="btn" id="btnRestore" onclick="restoreNote()" hidden>Restaurer la note</button>
        <button class="btn" id="btnExpand" aria-pressed="false" onclick="toggleEditorExpanded()">Plein écran</button>
        <button class="btn" id="btnClose" onclick="hideEditor()" title="Fermer la note" aria-label="Fermer la note">✕</button>
      </div>
    </div>
    <div class="tag-zone" id="tagZone">
      <span style="color:var(--muted);font-size:0.85rem;flex-shrink:0">Étiquettes :</span>
      <div id="tagChips"></div>
      <div style="position:relative;flex:1;min-width:100px">
        <input type="text" id="tagInput" aria-label="Ajouter une étiquette" placeholder="Ajouter un tag..." autocomplete="off">
        <div id="tagDropdown"></div>
      </div>
    </div>
    <div class="color-palette">
      <label>Couleur :</label>
      <div id="colorSwatches"></div>
    </div>
    <textarea id="body" aria-label="Contenu de la note" placeholder="Commencez à écrire..."></textarea>
    <div style="text-align:right; padding-top:10px">
      <button id="btnDelete" class="danger-link" onclick="deleteNote()">Mettre à la corbeille</button>
    </div>
  </main>
</div>

<div id="loginScreen">
  <div class="login-box">
    <h2>Notepad</h2>
    <p>Connectez-vous pour acceder a vos notes</p>
    <div class="login-field">
      <label for="loginEmail">Adresse e-mail</label>
      <input type="email" id="loginEmail" placeholder="vous@exemple.com" autocomplete="email">
    </div>
    <div class="login-field">
      <label for="loginPassword">Mot de passe</label>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
    </div>
    <div id="loginError"></div>
    <button id="btnLogin" onclick="handleLogin()">Se connecter</button>
  </div>
</div>

<div id="overlay"><div class="spinner"></div></div>
<dialog id="unsavedDialog" aria-labelledby="unsavedTitle">
  <form method="dialog">
    <h2 id="unsavedTitle">Modifications non enregistrées</h2>
    <p>Souhaitez-vous enregistrer cette note avant de continuer ?</p>
    <div class="dialog-actions">
      <button class="btn" value="cancel" autofocus>Annuler</button>
      <button class="btn" value="discard">Ne pas enregistrer</button>
      <button class="btn primary" value="save">Enregistrer</button>
    </div>
  </form>
</dialog>
<dialog id="historyDialog" aria-labelledby="historyTitle">
  <div class="dialog-heading"><h2 id="historyTitle">Versions précédentes</h2><button class="btn" onclick="document.getElementById('historyDialog').close()" aria-label="Fermer l’historique">✕</button></div>
  <p>Les 20 dernières versions sont conservées lors des prochains enregistrements.</p>
  <div id="historyList"></div>
</dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
